name: Maintenance checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '20 8 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      XDG_DATA_HOME: ${{ runner.temp }}/fornax-data
      XDG_CONFIG_HOME: ${{ runner.temp }}/fornax-config
      XDG_CACHE_HOME: ${{ runner.temp }}/fornax-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - name: Install locked tools and runtime
        run: python -m pip install --require-hashes -r requirements/linux-py313-dev.lock
      - name: Tests without Addons
        run: |
          mkdir -p build/security
          python -m pytest --import-mode=importlib -q tests features/editor --junitxml=build/security/tests.xml
      - name: Static analysis (medium and high severity)
        if: always()
        run: python -m bandit -r core features shared scripts main.py script_nuitka.py -x '*test*' -ll -f json -o build/security/bandit.json
      - name: Runtime vulnerabilities
        if: always()
        run: python -m pip_audit -r requirements/linux-py313-runtime.lock --require-hashes -f json -o build/security/pip-audit.json
      - name: Verify and run secret scanner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact --report-format json --report-path build/security/gitleaks-history.json
          python scripts/scan_worktree_secrets.py "$RUNNER_TEMP/gitleaks"
      - name: Archive validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintenance-evidence
          path: build/security/
          retention-days: 14
